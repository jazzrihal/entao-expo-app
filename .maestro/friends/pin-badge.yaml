appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "fotuu-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn: "Friends"
- runFlow:
    when:
      visible:
        id: "friends-feed"
    commands:
      - tapOn:
          point: "15%,40%"
      - assertVisible:
          id: "friends-post-detail"
      - runFlow:
          when:
            visible: "Unpin"
          commands:
            - tapOn: "Unpin"
            # `back` is unsupported on iOS; simulate the edge-swipe interactive pop gesture instead.
            - swipe:
                start: "1%,50%"
                end: "95%,50%"
            - assertNotVisible:
                id: "pinned-post-thumbnail"
            - tapOn:
                point: "15%,40%"
            - assertVisible:
                id: "friends-post-detail"
      - tapOn: "Pin"
      - swipe:
          start: "1%,50%"
          end: "95%,50%"
      - assertVisible:
          id: "pinned-post-thumbnail"
      - tapOn:
          point: "15%,40%"
      - assertVisible:
          id: "friends-post-detail"
      - tapOn: "Unpin"
      - swipe:
          start: "1%,50%"
          end: "95%,50%"
