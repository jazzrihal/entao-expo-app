appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn:
    text: "Friends"
    label: Open Friends tab
- assertVisible:
    id: "friends-feed"
    label: Seeded friends feed is visible
# Prefer bob-row-1 over row-0 for a reliably tappable post row.
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-0"
    direction: DOWN
    visibilityPercentage: 90
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-1"
    direction: DOWN
    visibilityPercentage: 90
- tapOn:
    id: "friends-feed-section-bob-row-1"
    label: Open Bob's second friends-feed row
- assertVisible:
    id: "friends-post-detail"
- runFlow:
    when:
      visible: "Unpin"
    commands:
      - tapOn: "Unpin"
      - extendedWaitUntil:
          visible: "Pin"
          timeout: 15000
- tapOn: "Pin"
- extendedWaitUntil:
    visible: "Unpin"
    timeout: 15000
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- extendedWaitUntil:
    visible:
      id: "friends-feed"
    timeout: 10000
# Friends feed may reorder after pin; badge testID is on the pinned Pressable.
- extendedWaitUntil:
    visible:
      id: "pinned-post-thumbnail"
    timeout: 15000
# Friends-pager reopen can show a stale Pin control; profile detail reflects
# pins reliably. Clear via Profile so later flows don't see this Bob pin on
# Alice's profile grid (list_profile_feed_posts includes pinned others' posts).
- tapOn: "Profile"
- assertVisible:
    id: "profile-post-grid"
- extendedWaitUntil:
    visible:
      id: "pinned-post-thumbnail"
    timeout: 15000
- tapOn:
    id: "pinned-post-thumbnail"
    label: Open pinned profile cell to clear pin-badge leftover
- assertVisible:
    id: "profile-post-detail"
- extendedWaitUntil:
    visible: "Unpin"
    timeout: 15000
- tapOn: "Unpin"
- extendedWaitUntil:
    visible: "Pin"
    timeout: 15000
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- extendedWaitUntil:
    visible:
      id: "profile-post-grid"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "pinned-post-thumbnail"
    timeout: 15000
    label: Pin badge cleared after profile unpin
