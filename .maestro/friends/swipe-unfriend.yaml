appId: com.jazzrihal.entao
# Mutates hosted seed data: permanently removes Bob as Alice's friend.
# clearState resets the app only — not Supabase. Full CI is safe because the
# job resets the hosted DB once per run; keep this flow last in flowsOrder so
# earlier friends coverage still sees Bob. Re-run locally only after a DB reset.
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "fotuu-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn: "Friends"
- tapOn:
    id: "friends-list-button"
# The row's own testID (on the outer @expo/ui `ListItem` Button) isn't exposed to the
# accessibility tree once the row also contains other interactive children (nested
# Text `onPress`); the row-name Text's testID is exposed reliably.
- assertVisible:
    id: "friend-row-bob-name"
- swipe:
    direction: LEFT
    from:
      id: "friend-row-bob-name"
    duration: 300
- tapOn: "Remove"
- assertNotVisible:
    id: "friend-row-bob-name"
