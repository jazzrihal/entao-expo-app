appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn:
    text: "Friends"
    label: Open Friends tab
- assertVisible:
    id: "friends-feed"
    label: Seeded friends feed is visible
# Full-bleed rows can sit partially under the nav/safe-area edge, so they may
# not hit 100% visibility — relax the scrollUntilVisible threshold.
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-0"
    direction: DOWN
    visibilityPercentage: 90
- assertVisible:
    id: "friends-feed-section-bob-row-0"
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-1"
    direction: DOWN
    visibilityPercentage: 90
- assertVisible:
    id: "friends-feed-section-bob-row-1"
- tapOn:
    id: "friends-feed-section-bob-row-1"
    label: Open Bob's second friends-feed row
- assertVisible:
    id: "friends-post-feed-pager"
- assertVisible:
    id: "friends-post-detail"
- swipe:
    direction: UP
    from:
      id: "friends-post-feed-pager"
