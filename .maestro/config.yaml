appId: com.jazzrihal.entao
flows:
  - "auth/*"
  - "friends/*"
  - "moments/*"
  - "posts/*"
  - "profile/*"
executionOrder:
  continueOnFailure: false
  # swipe-unfriend mutates hosted seed (removes Bob). Keep it last so earlier
  # friends/posts flows still see Bob; CI resets the DB once per suite run.
  #
  # Do NOT list android-only flows (e.g. offline-post-fallback) here. Maestro's
  # sequential planner stops at the first flowsOrder entry missing from the
  # tag-filtered set, and later entries fall into parallel flowsToRun — which
  # races clearState against sign-in when --exclude-tags android is set.
  flowsOrder:
    - sign-in
    - sign-in-validation
    - sign-out
    - sign-up
    - view-profile
    - view-profile-post-detail
    - view-user-profile-post-detail
    - list
    - search
    - requests
    - feed
    - pin-badge
    - open-profile-from-post
    - save-recall-delete
    - create-post
    - view-post-detail
    - open-post-deep-link
    - save-post-locally
    - delete-own-post
    - swipe-unfriend
