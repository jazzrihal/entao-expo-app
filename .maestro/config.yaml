appId: com.jazzrihal.entao
flows:
  - "auth/*"
  - "friends/*"
  - "moments/*"
  - "posts/*"
  - "profile/*"
executionOrder:
  continueOnFailure: false
  # swipe-unfriend mutates hosted seed (removes Bob). Keep it last so earlier
  # friends/posts flows still see Bob; CI resets the DB once per suite run.
  flowsOrder:
    - sign-in
    - sign-in-validation
    - sign-out
    - sign-up
    - view-profile
    - view-profile-post-detail
    - view-user-profile-post-detail
    - list
    - search
    - requests
    - feed
    - pin-badge
    - open-profile-from-post
    - save-recall-delete
    - create-post
    - view-post-detail
    - save-post-locally
    - offline-post-fallback
    - swipe-unfriend
