appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "fotuu-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn: "Home"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible:
        id: "home-feed-accept-location"
    commands:
      - tapOn:
          id: "home-feed-accept-location"
- extendedWaitUntil:
    visible:
      id: "home-feed-location"
    timeout: 15000
- copyTextFrom:
    id: "home-feed-location"
- tapOn: "Saved moments"
- assertVisible: "Saved Moments"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "moments-list-section"
    timeout: 10000
# `back` is unsupported on iOS; the moments screen is a modal, so swipe it down to dismiss.
# Start below the nav bar (a swipe starting at the very top can land on the header/Save
# button instead of the sheet's pan area) and use a slower drag so UIKit's interactive
# dismiss gesture recognizes it rather than treating it as a quick, ignored flick.
- swipe:
    start: "50%,15%"
    end: "50%,95%"
    duration: 600
- tapOn:
    id: "home-feed-location"
- assertVisible: "Pick Location"
# The search bar uses `placement: "integratedButton"`, which collapses it to a
# magnifying-glass icon button (accessibility label "Search") until tapped.
- tapOn: "Search"
- tapOn: "Search for a place or address"
- inputText: "Tokyo Tower"
# Tap the top suggestion row by testID rather than by its title text: the search
# field itself echoes the typed query as its own text, so a text-based tapOn can
# match (and select) the input field instead of the suggestion below it.
- extendedWaitUntil:
    visible:
      id: "location-search-suggestion-0"
    timeout: 10000
- tapOn:
    id: "location-search-suggestion-0"
- tapOn: "Confirm"
- extendedWaitUntil:
    visible:
      id: "home-feed"
    timeout: 10000
- tapOn: "Saved moments"
- assertVisible: "Saved Moments"
# Tap the (only) saved moment row by its testID prefix rather than a hardcoded
# point — its position shifts depending on section header heights. The row's own
# testID isn't exposed once it has a trailing Delete button; its label Text's
# testID (suffixed `-name`) is exposed reliably.
- tapOn:
    id: "moments-list-item-.*-name"
- extendedWaitUntil:
    visible:
      id: "home-feed-location"
    timeout: 10000
- assertVisible:
    text: ${maestro.copiedText}
- tapOn: "Saved moments"
- swipe:
    direction: LEFT
    from:
      id: "moments-list-item-.*-name"
    duration: 300
- tapOn: "Delete"
- extendedWaitUntil:
    visible:
      id: "moments-empty"
    timeout: 10000
