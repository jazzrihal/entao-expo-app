appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn:
    text: "Profile"
    label: Open Profile tab
- assertVisible: "Settings"
- assertVisible: "Share"
- tapOn: "Share"
- assertVisible: "entao.link"
# This iOS version's compact share sheet has no "Cancel" button; swipe it down to dismiss.
- swipe:
    start: "50%,70%"
    end: "50%,98%"
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    id: "profile-post-grid"
    label: Alice's seeded profile grid is visible
