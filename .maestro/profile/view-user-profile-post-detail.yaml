appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn:
    text: "Friends"
    label: Open Friends tab
- assertVisible:
    id: "friends-feed"
    label: Seeded friends feed is visible
# Prefer bob-row-1 over row-0 for a reliably tappable post row.
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-0"
    direction: DOWN
    visibilityPercentage: 90
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-1"
    direction: DOWN
    visibilityPercentage: 90
- tapOn:
    id: "friends-feed-section-bob-row-1"
    label: Open Bob's second friends-feed row
- assertVisible:
    id: "friends-post-detail"
- tapOn:
    id: "friends-post-detail-author"
    label: Open Bob's profile from post detail
- assertVisible:
    id: "user-profile"
- assertVisible:
    id: "user-profile-feed-grid"
    label: Bob's profile grid is seeded
- tapOn:
    id: "user-profile-feed-post-.*"
    index: 0
    label: Open first cell on Bob's profile grid
- assertVisible:
    id: "user-post-feed-pager"
- assertVisible:
    id: "user-post-detail"
- swipe:
    direction: UP
    from:
      id: "user-post-feed-pager"
# `back` is unsupported on iOS; simulate the edge-swipe interactive pop gesture instead.
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "user-profile"
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "friends-post-detail"
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "friends-feed"
