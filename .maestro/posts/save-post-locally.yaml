appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn: "Home"
- assertVisible:
    id: "home-feed"
- tapOn: "New post"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- tapOn:
    id: "camera-shutter-button"
- extendedWaitUntil:
    visible:
      id: "new-post-preview"
    timeout: 15000
- tapOn: "Save for later"
- assertVisible:
    id: "home-feed"
- tapOn: "Profile"
- assertVisible:
    id: "profile-post-grid"
- assertVisible:
    id: "local-post-thumbnail"
- assertNotVisible:
    id: "network-activity-indicator"
# Badge has pointerEvents none but Maestro still hits the parent cell in practice.
# Prefer this over a grid index — local cells are not always first after seed posts.
- tapOn:
    id: "local-post-thumbnail"
    label: Open local-only profile cell via local badge
- assertVisible:
    id: "profile-post-detail"
- assertVisible:
    id: "profile-post-detail-local-badge"
- assertNotVisible: "Share"
- assertNotVisible:
    id: "network-activity-indicator"
- assertVisible: "Post"
- tapOn: "Post"
# Local uploads finish before Maestro can observe the activity pill.
# The local badge leaving the profile grid is the completed upload.
- extendedWaitUntil:
    notVisible:
      id: "local-post-thumbnail"
    timeout: 30000
