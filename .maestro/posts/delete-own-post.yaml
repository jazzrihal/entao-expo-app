appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
  E2E_POST_CAPTION: ${E2E_POST_CAPTION || "Maestro delete-own-post caption"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
# Create a disposable post so seeded Alice posts stay intact across the suite.
- tapOn: "Home"
- assertVisible:
    id: "home-feed"
- tapOn: "New post"
- runFlow:
    when:
      visible:
        id: "new-post-camera-permission-required"
    commands:
      - tapOn:
          id: "new-post-request-camera-permission"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "camera-shutter-button"
    timeout: 20000
- tapOn:
    id: "camera-shutter-button"
- assertVisible:
    id: "new-post-preview"
- swipe:
    start: "50%,70%"
    end: "50%,30%"
- tapOn:
    id: "new-post-caption"
- inputText: ${E2E_POST_CAPTION}
- tapOn: "Post"
- assertVisible:
    id: "home-feed-grid"
# Open the newly created cloud post from profile (newest first; skip local cells).
- tapOn: "Profile"
- assertVisible:
    id: "profile-post-grid"
- runFlow:
    when:
      visible:
        id: "local-post-thumbnail"
    commands:
      - tapOn:
          id: "profile-feed-post-.*"
          index: 1
          label: Open newest cloud profile cell (skip local)
- runFlow:
    when:
      notVisible:
        id: "local-post-thumbnail"
    commands:
      - tapOn:
          id: "profile-feed-post-.*"
          index: 0
          label: Open newest cloud profile cell
- assertVisible:
    id: "profile-post-detail"
- assertVisible:
    text: ${E2E_POST_CAPTION}
- assertVisible: "Delete"
- tapOn: "Delete"
- tapOn: "Delete"
- extendedWaitUntil:
    visible:
      id: "profile-post-grid"
    timeout: 10000
- assertNotVisible:
    id: "profile-post-detail"
- assertNotVisible:
    text: ${E2E_POST_CAPTION}
