appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "fotuu-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn:
    text: "Home"
    label: Open Home tab
- assertVisible:
    id: "home-feed-grid"
    label: Seeded nearby home grid is visible
- tapOn:
    id: "home-feed-post-.*"
    index: 0
    label: Open first seeded home grid cell
- assertVisible:
    id: "home-post-feed-pager"
- assertVisible:
    id: "home-post-detail"
- assertVisible:
    id: "home-post-detail-image"
- tapOn:
    id: "home-post-detail-image"
- assertVisible: "Photo, contain"
- tapOn:
    id: "home-post-detail-image"
- assertVisible: "Photo, cover"
- assertVisible:
    id: "home-post-detail-author"
- assertVisible: "Share"
- tapOn: "Share"
- assertVisible: "então.com"
# This iOS version's compact share sheet has no "Cancel" button; swipe it down to dismiss.
- swipe:
    start: "50%,70%"
    end: "50%,98%"
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    id: "home-post-detail-caption"
- tapOn: "Like"
- tapOn: "Unlike"
# `back` is unsupported on iOS; simulate the edge-swipe interactive pop gesture instead.
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "home-feed-grid"
# Pin/unpin on Alice's own seeded profile posts — home nearby cells can belong to others.
- tapOn: "Profile"
- assertVisible:
    id: "profile-post-grid"
# Local-only cells cannot be pinned; skip the local badge cell when present.
- runFlow:
    when:
      visible:
        id: "local-post-thumbnail"
    commands:
      - tapOn:
          id: "profile-feed-post-.*"
          index: 1
          label: Open cloud profile cell (skip local)
- runFlow:
    when:
      notVisible:
        id: "local-post-thumbnail"
    commands:
      - tapOn:
          id: "profile-feed-post-.*"
          index: 0
          label: Open first Alice profile grid cell
- assertVisible:
    id: "profile-post-detail"
- runFlow:
    when:
      visible: "Unpin"
    commands:
      - tapOn: "Unpin"
- tapOn: "Pin"
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "profile-post-grid"
- assertVisible:
    id: "pinned-post-thumbnail"
# Badge has pointerEvents none but Maestro still hits the parent cell in practice.
- tapOn:
    id: "pinned-post-thumbnail"
    label: Open pinned profile cell via pin badge
- assertVisible:
    id: "profile-post-detail"
- assertVisible: "Unpin"
- tapOn: "Unpin"
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "profile-post-grid"
- assertNotVisible:
    id: "pinned-post-thumbnail"
