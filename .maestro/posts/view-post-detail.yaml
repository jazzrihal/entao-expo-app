appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "fotuu-local-dev"}
  E2E_POST_CAPTION: ${E2E_POST_CAPTION || "Golden hour from Maestro"}
---
- runFlow:
    file: create-post.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
      E2E_POST_CAPTION: ${E2E_POST_CAPTION}
- tapOn:
    point: "16%,32%"
- assertVisible:
    id: "home-post-feed-pager"
- assertVisible:
    id: "home-post-detail"
- assertVisible:
    id: "home-post-detail-image"
- tapOn:
    id: "home-post-detail-image"
- assertVisible: "Photo, contain"
- tapOn:
    id: "home-post-detail-image"
- assertVisible: "Photo, cover"
- assertVisible:
    id: "home-post-detail-author"
- assertVisible:
    id: "home-post-detail-share"
- tapOn:
    id: "home-post-detail-share"
- assertVisible: "então.com"
# This iOS version's compact share sheet has no "Cancel" button; swipe it down to dismiss.
- swipe:
    start: "50%,70%"
    end: "50%,98%"
    duration: 400
- assertVisible:
    id: "home-post-detail-caption"
- tapOn: "Like"
- tapOn: "Unlike"
- tapOn: "Pin"
# `back` is unsupported on iOS; simulate the edge-swipe interactive pop gesture instead.
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "home-feed-grid"
- assertVisible:
    id: "pinned-post-thumbnail"
- tapOn: "Profile"
- assertVisible:
    id: "profile-post-grid"
- assertVisible:
    id: "pinned-post-thumbnail"
# After earlier suite flows the profile grid can have many posts; open the pinned
# one via its badge rather than a fixed grid coordinate that may hit a newer
# unpinned cell.
- tapOn:
    id: "pinned-post-thumbnail"
- assertVisible:
    id: "profile-post-detail"
- assertVisible: "Unpin"
- tapOn: "Unpin"
- swipe:
    start: "1%,50%"
    end: "95%,50%"
- assertVisible:
    id: "profile-post-grid"
- assertNotVisible:
    id: "pinned-post-thumbnail"
- tapOn: "Home"
- assertVisible:
    id: "home-feed-grid"
- assertNotVisible:
    id: "pinned-post-thumbnail"
