appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- tapOn:
    text: "Friends"
    label: Open Friends tab
- assertVisible:
    id: "friends-feed"
    label: Seeded friends feed is visible
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-0"
    direction: DOWN
    visibilityPercentage: 90
- scrollUntilVisible:
    element:
      id: "friends-feed-section-bob-row-1"
    direction: DOWN
    visibilityPercentage: 90
- tapOn:
    id: "friends-feed-section-bob-row-1"
    label: Open Bob's second friends-feed row
- assertVisible:
    id: "friends-post-detail"
- tapOn:
    text: "More"
    label: Open more menu
- assertVisible: "Report"
- tapOn: "Report"
# BottomSheet does not expose its own testID; the title inside it does.
- assertVisible:
    id: "report-sheet-title"
- assertVisible:
    id: "report-reason-picker"
- tapOn:
    id: "report-reason-picker"
- tapOn: "Spam"
- tapOn:
    id: "report-submit"
- assertVisible: "Report submitted"
- tapOn: "OK"
