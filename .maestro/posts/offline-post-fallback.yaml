appId: com.jazzrihal.entao
# Airplane-mode toggling only works reliably on Android.
# Tagged so iOS CI excludes it via --exclude-tags android.
tags:
  - android
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      E2E_EMAIL: ${E2E_EMAIL}
      E2E_PASSWORD: ${E2E_PASSWORD}
- setAirplaneMode: enabled
- tapOn: "Home"
- assertVisible:
    id: "home-feed"
- tapOn: "New post"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- tapOn:
    id: "camera-shutter-button"
- assertVisible:
    id: "new-post-preview"
- tapOn: "Post"
# Post fails silently and saves locally; expect navigation back to home
- assertVisible:
    id: "home-feed"
- tapOn: "Profile"
- assertVisible:
    id: "profile-post-grid"
- assertVisible:
    id: "local-post-thumbnail"
- setAirplaneMode: disabled
# Global indicator lights up while the outbox upload loop has work, then clears.
- extendedWaitUntil:
    visible:
      id: "network-activity-indicator"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "network-activity-indicator"
    timeout: 30000
# Wait for background sync to complete (up to 30s)
- extendedWaitUntil:
    notVisible:
      id: "local-post-thumbnail"
    timeout: 30000
