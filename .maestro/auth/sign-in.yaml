appId: com.jazzrihal.entao
# entao-supabase-backend supabase/seed.sql — survives `supabase db reset`
#
# Dual role: suite flow #1 and the shared auth subflow for feature flows.
# Contract: ends on Profile with "Sign out" visible (stable logged-in probe;
# Home can still be resolving location). Consumers must navigate to Home/Friends.
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
  E2E_PASSWORD: ${E2E_PASSWORD || "entao-local-dev"}
---
- launchApp:
    clearState: true
    # Avoid iOS Password AutoFill prompting "Save Password?" after sign-in on a
    # fresh CI simulator (that sheet blocks Profile / Sign out).
    clearKeychain: true
    # Pre-grant "While Using" location so the system permission sheet cannot race
    # Profile / Sign out. Use `inuse` (not `allow`) — Maestro maps location through
    # simctl privacy, which only accepts always|inuse|never.
    permissions:
      location: inuse
      camera: allow
      # Avoid the push permission sheet racing Profile after first sign-in.
      notifications: deny
# The simulator has no GPS fix by default, so `getCurrentPositionAsync()` in the app
# hangs for ~15-20s before failing, which both slows every flow down and races with
# the "Grant access to your location?" fallback sheet blocking navigation below.
# Mock a fix near the seeded Tokyo post cluster (entao-supabase-backend/supabase/seeds/02_posts.sql)
# so location resolves instantly and the Home feed shows seeded nearby posts.
- setLocation:
    latitude: 35.6762
    longitude: 139.6503
# Cold release launches on CI macos runners are slower than local; wait explicitly.
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 60000
# Continue with Apple renders on iOS when Sign in with Apple is available.
# Do not tap it — Apple provider sandbox is not available in CI.
- assertVisible:
    id: "auth-apple-button"
- tapOn:
    id: "sign-in-email"
- eraseText
- inputText: ${E2E_EMAIL}
- waitForAnimationToEnd
# Fresh CI simulators can show QuickPath keyboard coaching after the first
# focus; it steals the next tap so the password lands in the email field.
- repeat:
    while:
      visible: "Speed up your typing.*"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
# After email focus the keyboard + Passwords autofill bar sit over the password
# field (field y≈569 overlaps Passwords bar y≈539). Tapping sign-in-password
# then hits Passwords / leaves email focused, so password lands in the email field.
# Dismiss first by tapping the title well above the keyboard (hideKeyboard is flaky
# on iOS). Do NOT tap near the keyboard top to dismiss.
- tapOn: "Welcome back"
- waitForAnimationToEnd
- tapOn:
    id: "sign-in-password"
- eraseText
- inputText: ${E2E_PASSWORD}
- waitForAnimationToEnd
- repeat:
    while:
      visible: "Speed up your typing.*"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
# Dismiss again so sign-in-button is above the keyboard and hittable.
- tapOn: "Welcome back"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 15000
- tapOn:
    id: "sign-in-button"
# "Save Password?" / ATT "Not Now" can appear after auth settles — dismiss while
# present rather than checking once immediately after the button tap.
- repeat:
    while:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# Push permission (if not pre-denied) blocks Profile the same way.
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications.*"
    commands:
      - tapOn: "Don’t Allow"
# With a mocked GPS fix above, location resolves without the "Grant access to your
# location?" fallback sheet — but guard defensively in case it still races in.
- runFlow:
    when:
      visible:
        id: "home-feed-location-actions"
    commands:
      - tapOn: "Reject"
# Auth + tab settle can lag on CI; wait before tapping and for the logged-in probe.
- extendedWaitUntil:
    visible: "Profile"
    timeout: 30000
# Password / notification sheets can still race in after tabs appear.
- repeat:
    while:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: ".*Would Like to Send You Notifications.*"
    commands:
      - tapOn: "Don’t Allow"
- tapOn: "Profile"
- repeat:
    while:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 30000
