appId: com.jazzrihal.entao
env:
  E2E_EMAIL: ${E2E_EMAIL || "alice@example.com"}
---
- launchApp:
    clearState: true

# Cold launch after clearState (and keychain/permission setup from prior flows on
# the same sim) can settle after Maestro's default tap timeout — wait first.
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 60000

# Empty fields — sync validation (distinguishes from async wrong-password assert)
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "sign-in-error"
    timeout: 5000
- assertVisible: "Please enter your email and password."

# Wrong password — async Supabase error (hosted on CI; allow network latency)
- tapOn:
    id: "sign-in-email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: "wrongpassword"
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "sign-in-error"
    timeout: 20000
