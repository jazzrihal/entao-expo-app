appId: com.jazzrihal.entao
env:
  NEW_EMAIL: ${E2E_SIGN_UP_EMAIL || "e2e-new@fotuu.com"}
  NEW_PASSWORD: ${E2E_SIGN_UP_PASSWORD || "Password123!"}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 60000
- tapOn:
    id: "sign-in-link-to-sign-up"
- extendedWaitUntil:
    visible:
      id: "sign-up-email"
    timeout: 15000
- tapOn:
    id: "sign-up-email"
- inputText: ${NEW_EMAIL}
# iOS Strong Password dialog blocks all but the first character; dismiss via confirm field.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "sign-up-password"
      - inputText: "x"
      - tapOn:
          id: "sign-up-confirm-password"
      - inputText: ${NEW_PASSWORD}
      - tapOn:
          id: "sign-up-password"
      - eraseText: 1
      - inputText: ${NEW_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "sign-up-password"
      - inputText: ${NEW_PASSWORD}
      - tapOn:
          id: "sign-up-confirm-password"
      - inputText: ${NEW_PASSWORD}
- tapOn:
    id: "sign-up-button"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# Local Supabase skips email confirmation and lands on tabs immediately.
# Hosted requires confirmation and shows sign-up-confirmation.
# Exactly one success path must hard-fail if neither appears.
- runFlow:
    when:
      notVisible:
        id: "sign-up-confirmation"
    commands:
      - assertVisible: "Friends"
      - tapOn: "Profile"
      - assertVisible: "Sign out"
- runFlow:
    when:
      visible:
        id: "sign-up-confirmation"
    commands:
      - assertVisible:
          id: "sign-up-confirmation"
