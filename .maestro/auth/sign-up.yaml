appId: com.jazzrihal.entao
env:
  NEW_EMAIL: ${E2E_SIGN_UP_EMAIL || "e2e-new@entao.app"}
  NEW_PASSWORD: ${E2E_SIGN_UP_PASSWORD || "Password123!"}
---
- launchApp:
    clearState: true
    # Avoid iOS Password AutoFill / Save Password sheet racing post-auth
    # (same rationale as sign-in.yaml).
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 60000
- tapOn:
    id: "sign-in-link-to-sign-up"
- extendedWaitUntil:
    visible:
      id: "sign-up-email"
    timeout: 15000
- tapOn:
    id: "sign-up-email"
- eraseText
- inputText: ${NEW_EMAIL}
- waitForAnimationToEnd
# Fresh simulators can show QuickPath keyboard coaching after the first focus;
# it steals the next tap so the password lands in the email field.
- repeat:
    while:
      visible: "Speed up your typing.*"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
# After email focus the keyboard + Passwords autofill bar sit over the password
# fields. Dismiss by tapping the title well above the keyboard (hideKeyboard is
# flaky on iOS). Same pattern as sign-in's "Welcome back" dismiss.
# index: 0 — title and submit button share the label "Create account".
- tapOn:
    text: "Create account"
    index: 0
- waitForAnimationToEnd
# `autoComplete="new-password"` triggers iOS "Use Strong Password?" which is NOT
# in the XCUITest hierarchy (can't assert/tap its Close). Typing a single char
# raises the sheet; tapping the title above it dismisses it so a full password
# can be entered afterward. Confirm-field dismiss is unreliable — the sheet
# covers that field and intercepts the tap.
- tapOn:
    id: "sign-up-password"
- inputText: "x"
- waitForAnimationToEnd
- tapOn:
    text: "Create account"
    index: 0
- waitForAnimationToEnd
- tapOn:
    id: "sign-up-password"
- eraseText
- inputText: ${NEW_PASSWORD}
- waitForAnimationToEnd
- repeat:
    while:
      visible: "Speed up your typing.*"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- tapOn:
    text: "Create account"
    index: 0
- waitForAnimationToEnd
- tapOn:
    id: "sign-up-confirm-password"
- eraseText
- inputText: ${NEW_PASSWORD}
- waitForAnimationToEnd
# Dismiss so sign-up-button is above the keyboard and hittable.
- tapOn:
    text: "Create account"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "sign-up-button"
    timeout: 15000
- tapOn:
    id: "sign-up-button"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
# Local Supabase skips email confirmation and lands on tabs immediately.
# Hosted requires confirmation and shows sign-up-confirmation.
# Exactly one success path must hard-fail if neither appears.
- runFlow:
    when:
      notVisible:
        id: "sign-up-confirmation"
    commands:
      - assertVisible: "Friends"
      - tapOn: "Profile"
      - assertVisible: "Sign out"
- runFlow:
    when:
      visible:
        id: "sign-up-confirmation"
    commands:
      - assertVisible:
          id: "sign-up-confirmation"
